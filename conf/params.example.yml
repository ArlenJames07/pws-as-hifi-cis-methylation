input: assets/samplesheet.csv
outdir: results
work_dir: work
stage: alignment

# Reference resources (T2T-CHM13v2.0)
reference: /absolute/path/to/chm13v2.0.fa
reference_fai: /absolute/path/to/chm13v2.0.fa.fai
tandem_repeats: /absolute/path/to/chm13v2.0.trf.bed
cnv_exclude: /absolute/path/to/cnv.exclude.bed
cpg_model: /absolute/path/to/pileup_calling_model.v1.tflite

# Optional manuscript-figure inputs
run_figures: false
gtf: /absolute/path/to/chm13v2.0.gtf
metadata: assets/metadata.csv
icr_bed: /absolute/path/to/icr.bed
segdup_bed: /absolute/path/to/segmental_duplications.bed
imprintome_bed: /absolute/path/to/imprinted_regions.bed
repeats_bed: /absolute/path/to/repeatmasker.bed

# Figures 4 and 5 are render-only and require their original precomputed tables.
figure4_tables: null
figure5_tables: null

# Programs: command names are sufficient when they are on PATH. Absolute paths
# can be used for a workstation-specific run.
pbmm2_bin: pbmm2
samtools_bin: samtools
deepvariant_bin: run_deepvariant
bcftools_bin: bcftools
pbsv_bin: pbsv
hiphase_bin: hiphase
hificnv_bin: hificnv
pbcpgtools_bin: aligned_bam_to_cpg_scores
